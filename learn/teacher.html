<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2f45">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../assets/img/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <title>mi.Game · Teacher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    .tp { display: flex; flex-direction: column; gap: 22px; }
    .tp-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .tp-head h1 { font-size: var(--s-xxl); color: var(--navy); flex: 1 1 260px; min-width: 0; margin: 0; }
    .new-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .new-row .field { flex: 1; min-width: 200px; margin: 0; }
    .made { margin-top: 16px; padding: 16px; border-radius: 16px; background: var(--sun-soft); border: 2px solid var(--line); display: flex; gap: 14px 24px; flex-wrap: wrap; align-items: center; }
    .made dl { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 0; align-items: baseline; }
    .made dt { font-weight: 800; color: var(--muted); font-size: var(--s-sm); }
    .made dd { margin: 0; font-family: var(--f-code); font-weight: 600; font-size: 1.3rem; }
    .made p { margin: 0; flex-basis: 100%; font-size: var(--s-sm); font-weight: 700; color: var(--muted); }
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 2px dashed var(--hair); vertical-align: middle; }
    th { font-size: var(--s-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    td.tnum { font-variant-numeric: tabular-nums; }
    .who { display: flex; align-items: center; gap: 8px; font-weight: 800; }
    .who svg { width: 32px; height: 32px; flex: none; }
    .codecell { font-family: var(--f-code); }
    .codecell button, .act { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 2px 10px; font-weight: 800; cursor: pointer; font-size: var(--s-sm); }
    .act.danger { color: var(--bad); }
    .lv { display: flex; flex-wrap: wrap; gap: 4px; }
    .lv span { font-family: var(--f-pixel); font-size: .6rem; background: var(--sun); border: 2px solid var(--line); border-radius: 8px; padding: 4px 6px 3px; }
    .empty { color: var(--muted); font-weight: 700; }
    .msg { min-height: 1.4em; margin: 8px 0 0; font-weight: 800; color: var(--bad); }
    .confirm-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="site-head"></header>
  <main><div class="wrap" id="tp"></div></main>
  <footer class="site-foot"></footer>

  <script src="../assets/site.js"></script>
  <script src="assets/firebase-config.js"></script>
  <script src="assets/cloud.js"></script>
  <script>window.MG = { course: function (c) { MG.stages = c.stages || []; } };</script>
  <script src="content/course.js"></script>
  <script src="assets/teacher.js"></script>
</body>
</html>
